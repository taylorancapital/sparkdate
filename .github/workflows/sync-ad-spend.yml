name: sync ad spend

# Pulls PAID ad spend into Firestore so the admin dashboard can trend it and
# attribute it per event, instead of showing a figure somebody typed once.
#
# Two sources since 2026-09-04: Meta (from the Graph API) and Google Ads (from
# GA4, which holds the cost via the linked account). They write to the same
# `ad_spend` collection but never to the same document -- Meta owns
# `{date}`, Google owns `{date}__google` -- because the writes are whole-document
# `set` calls and a shared id would silently destroy the other source's day.
#
# Why here and not Vercel: api/ holds exactly 12 functions, which is the Hobby
# plan's cap, so a thirteenth would mean deleting one or paying for Pro. Same
# reasoning as social-publish.yml.
#
# Every four hours rather than every fifteen minutes. Meta's own reporting lags
# by up to a few hours and spend figures for the current day keep moving until
# it settles, so a tighter schedule would burn API calls to rewrite the same
# unfinished number. Four hours is well inside "live" for a dashboard read by a
# human, and the run is idempotent -- each day overwrites its own document, so
# re-reading an unsettled day costs nothing and corrects itself.

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to sync (default 30)'
        default: '30'
      execute:
        description: 'Actually write to Firestore (unchecked = dry run)'
        type: boolean
        default: false

# Two overlapping runs would write the same documents. Harmless in principle,
# since each day's doc is keyed by date and overwritten wholesale rather than
# incremented -- but there is no reason to pay for it twice.
concurrency:
  group: sync-ad-spend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Sync Meta spend into Firestore
        env:
          META_ADS_ACCESS_TOKEN: ${{ secrets.META_ADS_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          DAYS: ${{ github.event.inputs.days || '30' }}
        run: |
          # A missing secret must not look like a successful sync. Report which
          # one and fall back to a dry run, the same way social-publish does.
          MISSING=""
          [ -z "$META_ADS_ACCESS_TOKEN" ] && MISSING="$MISSING META_ADS_ACCESS_TOKEN"
          [ -z "$FIREBASE_PROJECT_ID" ]   && MISSING="$MISSING FIREBASE_PROJECT_ID"
          [ -z "$FIREBASE_CLIENT_EMAIL" ] && MISSING="$MISSING FIREBASE_CLIENT_EMAIL"
          [ -z "$FIREBASE_PRIVATE_KEY" ]  && MISSING="$MISSING FIREBASE_PRIVATE_KEY"

          if [ -n "$MISSING" ]; then
            echo "::warning::Not writing -- missing secret(s):$MISSING"
            echo "Add them under Settings -> Secrets -> Actions. Running as a dry run."
            node scripts/sync-meta-spend.js --days="$DAYS"
            exit 0
          fi

          # workflow_dispatch defaults to a dry run so the button is safe to
          # press; the schedule always writes, which is the point of it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.execute }}" != "true" ]; then
            echo "Manual run without 'execute' ticked -- dry run."
            node scripts/sync-meta-spend.js --days="$DAYS"
          else
            node scripts/sync-meta-spend.js --days="$DAYS" --execute
          fi

      # Google Ads spend, added 2026-09-04. Meta was never the only paid
      # channel -- $37.91 ran on Google between 06-15 and 07-24 and reached
      # neither `ad_spend` nor any CAC figure, because sync-meta-spend.js was
      # the collection's only writer.
      #
      # Its own step rather than a second command in the one above, so that a
      # Google failure cannot mark the Meta sync red (or vice versa) and the
      # log says plainly which source moved.
      #
      # Cost comes from GA4, not the Google Ads API: GA4 already holds it via
      # the linked account, and the Google Ads API would need a developer token
      # and its own OAuth client for the same number.
      - name: Sync Google Ads spend into Firestore
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          DAYS: ${{ github.event.inputs.days || '30' }}
        run: |
          # Same rule as the Meta step: a missing secret must not look like a
          # successful sync. Google spend has been dormant since 2026-07-24, so
          # "0 documents" is a legitimate result and would otherwise be
          # indistinguishable from "never authenticated".
          MISSING=""
          [ -z "$GA4_SERVICE_ACCOUNT_JSON" ] && MISSING="$MISSING GA4_SERVICE_ACCOUNT_JSON"
          [ -z "$FIREBASE_PROJECT_ID" ]      && MISSING="$MISSING FIREBASE_PROJECT_ID"
          [ -z "$FIREBASE_CLIENT_EMAIL" ]    && MISSING="$MISSING FIREBASE_CLIENT_EMAIL"
          [ -z "$FIREBASE_PRIVATE_KEY" ]     && MISSING="$MISSING FIREBASE_PRIVATE_KEY"

          if [ -n "$MISSING" ]; then
            echo "::warning::Not writing Google Ads spend -- missing secret(s):$MISSING"
            echo "GA4_SERVICE_ACCOUNT_JSON is the whole service-account JSON, pasted as one secret."
            echo "Add it under Settings -> Secrets -> Actions. Skipping this step."
            exit 0
          fi

          # The Data API client reads a FILE path, not the JSON itself.
          printf '%s' "$GA4_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/ga4-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ga4-sa.json"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.execute }}" != "true" ]; then
            echo "Manual run without 'execute' ticked -- dry run."
            node scripts/sync-google-ads-spend.js --days="$DAYS"
          else
            node scripts/sync-google-ads-spend.js --days="$DAYS" --execute
          fi
