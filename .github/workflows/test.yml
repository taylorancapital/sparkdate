name: tests

# Run unit tests on every push and PR. Currently covers the pure-logic
# modules in lib/* (CORS allowlist, unsubscribe HMAC, tier price mapping).
# Server endpoints under api/* aren't unit-tested yet — they need
# Firestore + Stripe mocks; track that as a follow-up to audit H5.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm run test:ci
        env:
          # Tests stub these via beforeEach; setting placeholders here
          # avoids any "secret not set" throws from module-load paths.
          UNSUBSCRIBE_SECRET: ci-placeholder-secret
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
