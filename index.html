<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SparkDate - Speed Dating App</title>
  <meta http-equiv="refresh" content="0;url=/participant-landing-revamped.html">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #FF006E 0%, #3A86FF 100%);
      color: white;
    }
    
    .container {
      text-align: center;
    }
    
    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }
    
    p {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    
    a {
      display: inline-block;
      padding: 14px 32px;
      background: white;
      color: #FF006E;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 700;
      transition: all 0.3s;
    }
    
    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>✨ SparkDate</h1>
    <p>Redirecting you to the app...</p>
    <a href="/participant-landing-revamped.html">Click here if not redirected</a>
  </div>

  <script>
    window.location.href = '/participant-landing-revamped.html';
  </script>
</body>
</html>
