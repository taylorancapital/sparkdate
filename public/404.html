<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found - SparkDate</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-navy: #0a0e27;
            --coral: #ff6b6b;
            --gold: #d4af37;
            --cream: #f5f3f0;
            --white: #ffffff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: var(--cream);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav {
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 107, 107, 0.1);
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--white);
            letter-spacing: -1px;
            text-decoration: none;
        }
        .logo span { color: var(--coral); }
        .nav-menu {
            display: flex;
            gap: 40px;
            list-style: none;
        }
        .nav-menu a {
            color: var(--cream);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }
        .nav-menu a:hover { color: var(--coral); }
        .cta-nav { background: linear-gradient(135deg, var(--coral) 0%, #ff5252 100%); color: var(--white); padding: 10px 24px; border-radius: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; transition: all 0.3s; }
        .cta-nav:hover { background: var(--white); color: var(--coral); transform: translateY(-2px); }

        /* Mobile nav toggle — hidden on desktop; see .nav-menu's mobile
           rules below for the slide-down panel. */
        .nav-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 32px;
            height: 32px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        .nav-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background: var(--white);
            border-radius: 2px;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }
        .nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
        .nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
        }
        .content {
            text-align: center;
            max-width: 640px;
        }
        .code {
            font-family: 'Playfair Display', serif;
            font-size: clamp(96px, 22vw, 180px);
            font-weight: 900;
            line-height: 1;
            color: var(--coral);
            letter-spacing: -6px;
            margin-bottom: 12px;
        }
        .code span {
            color: var(--white);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 900;
            color: var(--white);
            margin-bottom: 16px;
            letter-spacing: -1px;
        }
        p {
            font-size: 16px;
            color: rgba(245, 243, 240, 0.7);
            line-height: 1.7;
            margin-bottom: 32px;
        }
        .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
            border: 2px solid var(--coral);
        }
        .btn-primary {
            background: var(--coral);
            color: var(--white);
        }
        .btn-primary:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: transparent;
            color: var(--coral);
        }
        .btn-secondary:hover {
            background: rgba(255, 107, 107, 0.1);
        }
        footer {
            padding: 30px 40px;
            text-align: center;
            color: rgba(245, 243, 240, 0.4);
            font-size: 12px;
            border-top: 1px solid rgba(255, 107, 107, 0.1);
        }
        @media (max-width: 640px) {
            nav { padding: 16px 20px; position: relative; }
            .nav-toggle { display: flex; }
            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                flex-direction: column;
                gap: 0;
                background: rgba(10, 14, 39, 0.98);
                border-bottom: 1px solid rgba(255, 107, 107, 0.15);
                padding: 8px 20px 20px;
            }
            .nav-menu.open { display: flex; }
            .nav-menu li { width: 100%; }
            .nav-menu a { display: block; padding: 14px 0; border-bottom: 1px solid rgba(255, 107, 107, 0.08); }
            .nav-menu li:last-child a { border-bottom: none; }
            .nav-menu .cta-nav { display: inline-block; margin-top: 10px; text-align: center; }
            main { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="logo">Spark<span>Date</span></a>
            <button type="button" class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/">Home</a></li>
                <li><a href="/events" class="cta-nav">Join</a></li>
                <li><a href="/events">Events</a></li>
                <li><a href="/blog">Blog</a></li>
                <li><a href="/account">Account</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </div>
    </nav>
    <script>
      (function () {
        var toggle = document.getElementById('navToggle');
        var menu = document.getElementById('navMenu');
        if (!toggle || !menu) return;
        function closeMenu() { menu.classList.remove('open'); toggle.setAttribute('aria-expanded', 'false'); }
        function openMenu() { menu.classList.add('open'); toggle.setAttribute('aria-expanded', 'true'); }
        toggle.addEventListener('click', function () {
          if (menu.classList.contains('open')) closeMenu(); else openMenu();
        });
        menu.addEventListener('click', function (e) { if (e.target.tagName === 'A') closeMenu(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
      })();
    </script>

    <main>
        <div class="content">
            <div class="code">4<span>0</span>4</div>
            <h1>This page got ghosted.</h1>
            <p>The page you're looking for doesn't exist — or it's hiding from you, which honestly tracks for modern dating.</p>
            <div class="actions">
                <a href="/" class="btn btn-primary">Back home</a>
                <a href="/events" class="btn btn-secondary">Browse events</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SparkDate. Philadelphia. Real people. Real venues.</p>
    </footer>
</body>
</html>
