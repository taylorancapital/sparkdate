<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Internal door tool — never index. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Check-in — SparkDate</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --navy: #0a0e27; --coral: #ff6b6b; --cream: #f5f3f0; --white: #fff; --success: #4ade80; --danger: #f87171; --info: #60a5fa; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%); color: var(--cream); line-height: 1.5; min-height: 100vh; padding: 20px; }
        .wrap { max-width: 480px; margin: 0 auto; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; color: var(--white); text-align: center; margin-bottom: 4px; }
        .logo span { color: var(--coral); }
        .evt { text-align: center; color: rgba(245,243,240,0.7); font-size: 14px; margin-bottom: 20px; }
        .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,107,107,0.2); border-radius: 10px; padding: 24px 20px; }
        label { display: block; font-size: 12px; font-weight: 700; color: rgba(245,243,240,0.85); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type=email], input[type=text], input[type=tel] { width: 100%; padding: 14px 15px; background: #fff; border: 2px solid rgba(255,107,107,0.35); border-radius: 6px; color: #000; font-family: inherit; font-size: 16px; }
        input:focus { outline: none; border-color: var(--coral); }
        .seg { display: flex; gap: 10px; }
        .seg button { flex: 1; padding: 14px; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15); border-radius: 6px; color: var(--cream); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
        .seg button.on { background: var(--coral); border-color: var(--coral); color: #fff; }
        .toggle-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
        .toggle-row input { width: 22px; height: 22px; accent-color: var(--coral); }
        .toggle-row label { margin: 0; text-transform: none; font-size: 14px; font-weight: 500; letter-spacing: 0; }
        .submit { width: 100%; margin-top: 22px; padding: 17px; background: linear-gradient(135deg, var(--coral) 0%, #ff5252 100%); color: #fff; border: none; border-radius: 6px; font-weight: 700; font-size: 16px; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; }
        .submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
        .count { text-align: center; font-size: 13px; color: rgba(245,243,240,0.6); margin: 18px 0 8px; }
        .count strong { color: var(--success); font-size: 18px; }
        .recent { list-style: none; font-size: 13px; }
        .recent li { padding: 8px 12px; background: rgba(255,255,255,0.03); border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .recent .tag { color: rgba(245,243,240,0.45); font-size: 11px; }
        .overlay { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
        .overlay .card { width: 100%; max-width: 360px; }
        .overlay h1 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 4px; }
        .overlay p { font-size: 13px; color: rgba(245,243,240,0.6); margin-bottom: 8px; }
        .err { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }
        .logout { display: block; margin: 18px auto 0; background: none; border: none; color: rgba(245,243,240,0.5); font-size: 12px; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <!-- Admin login gate (same Firebase admin-claim gate as /admin) -->
    <div class="overlay" id="loginOverlay">
        <div class="card">
            <div class="logo">Spark<span>Date</span></div>
            <h1>Check-in</h1>
            <p>Admin sign-in required.</p>
            <label for="adminEmail">Email</label>
            <input type="email" id="adminEmail" autocomplete="username">
            <label for="adminPassword">Password</label>
            <input type="text" id="adminPassword" style="-webkit-text-security:disc;" autocomplete="current-password">
            <button class="submit" onclick="adminLogin()">Sign in</button>
            <div class="err" id="loginError"></div>
        </div>
    </div>

    <div class="wrap" id="app" style="display:none;">
        <div class="logo">Spark<span>Date</span></div>
        <div class="evt" id="evtLine">Loading event…</div>

        <div class="card">
            <form id="checkinForm" autocomplete="off">
                <label for="ciEmail">Email *</label>
                <input type="email" id="ciEmail" required autocomplete="off" inputmode="email">

                <label for="ciName">First name</label>
                <input type="text" id="ciName" autocomplete="off">

                <label>Gender</label>
                <div class="seg" id="genderSeg">
                    <button type="button" data-g="woman">Woman</button>
                    <button type="button" data-g="man">Man</button>
                </div>

                <div class="toggle-row">
                    <input type="checkbox" id="ciFirstTime">
                    <label for="ciFirstTime">First time at a SparkDate event?</label>
                </div>
                <div class="toggle-row">
                    <input type="checkbox" id="ciPhoto">
                    <label for="ciPhoto">OK to feature in photos / stories?</label>
                </div>

                <button type="submit" class="submit" id="ciSubmit">Check in →</button>
                <div class="msg" id="ciMsg"></div>
            </form>
        </div>

        <div class="count">Checked in this session: <strong id="ciCount">0</strong></div>
        <ul class="recent" id="ciRecent"></ul>
        <button class="logout" onclick="adminLogout()">Sign out</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJ4s0ZC1xZD3DNGSDx7a9Axd6aY3VPD3Q",
            authDomain: "sparkdate-philly.firebaseapp.com",
            projectId: "sparkdate-philly",
            storageBucket: "sparkdate-philly.firebasestorage.app",
            messagingSenderId: "330206052938",
            appId: "1:330206052938:web:18762191153f4037b75cb3"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let event = null;   // { id, title }
        let gender = null;
        let count = 0;

        window.adminLogin = async () => {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const err = document.getElementById('loginError');
            err.style.display = 'none';
            try { await signInWithEmailAndPassword(auth, email, password); }
            catch (e) { err.textContent = e.message; err.style.display = 'block'; }
        };
        window.adminLogout = async () => { try { await signOut(auth); } catch (_) {} };

        async function isAdmin(user) {
            if (!user) return false;
            try { const t = await user.getIdTokenResult(true); return t.claims?.admin === true; }
            catch (_) { return false; }
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                document.getElementById('loginOverlay').style.display = '';
                document.getElementById('app').style.display = 'none';
                return;
            }
            if (!(await isAdmin(user))) {
                const err = document.getElementById('loginError');
                err.textContent = 'This account is not an admin.';
                err.style.display = 'block';
                try { await signOut(auth); } catch (_) {}
                return;
            }
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadEvent();
        });

        async function loadEvent() {
            const line = document.getElementById('evtLine');
            try {
                const r = await fetch('/api/next-event');
                const d = await r.json();
                if (d && d.event && d.event.id) {
                    event = { id: d.event.id, title: d.event.title || 'SparkDate event' };
                    const dt = d.event.date ? new Date(d.event.date) : null;
                    const when = dt ? dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
                    line.textContent = `${event.title}${when ? ' · ' + when : ''}`;
                } else {
                    line.textContent = 'No upcoming event found — check /admin.';
                }
            } catch (_) { line.textContent = 'Could not load event. Check connection.'; }
        }

        // Gender segmented control
        document.getElementById('genderSeg').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-g]');
            if (!btn) return;
            gender = btn.dataset.g;
            document.querySelectorAll('#genderSeg button').forEach(b => b.classList.toggle('on', b === btn));
        });

        const form = document.getElementById('checkinForm');
        const submitBtn = document.getElementById('ciSubmit');
        const msg = document.getElementById('ciMsg');

        function resetForm() {
            form.reset(); gender = null;
            document.querySelectorAll('#genderSeg button').forEach(b => b.classList.remove('on'));
            document.getElementById('ciEmail').focus();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!event) { msg.style.color = 'var(--danger)'; msg.textContent = 'No event loaded.'; return; }
            const email = document.getElementById('ciEmail').value.trim();
            const firstName = document.getElementById('ciName').value.trim();
            const firstTime = document.getElementById('ciFirstTime').checked;
            const photoConsent = document.getElementById('ciPhoto').checked;
            submitBtn.disabled = true; submitBtn.textContent = 'Checking in…'; msg.textContent = '';
            try {
                const idToken = await auth.currentUser.getIdToken();
                const res = await fetch('/api/lead-signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
                    body: JSON.stringify({ action: 'checkin', email, firstName, gender, firstTime, photoConsent, eventId: event.id, eventTitle: event.title }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Check-in failed');
                count++;
                document.getElementById('ciCount').textContent = count;
                const li = document.createElement('li');
                const tag = data.alreadyRegistered ? 'ticket holder' : (data.createdUser ? 'new' : 'returning');
                const hesc = s => String(s||').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                li.innerHTML = `<span>${hesc(firstName || email)}</span><span class="tag">✓ ${hesc(tag)}</span>`;
                document.getElementById('ciRecent').prepend(li);
                msg.style.color = 'var(--success)'; msg.textContent = '✓ Checked in';
                resetForm();
            } catch (err) {
                msg.style.color = 'var(--danger)'; msg.textContent = err.message || 'Failed. Try again.';
            } finally {
                submitBtn.disabled = false; submitBtn.textContent = 'Check in →';
            }
        });
    </script>
</body>
</html>
