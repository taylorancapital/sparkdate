<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Internal door tool — never index. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Check-in — SparkDate</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --navy: #0a0e27; --coral: #ff6b6b; --cream: #f5f3f0; --white: #fff; --success: #4ade80; --danger: #f87171; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%); color: var(--cream); line-height: 1.5; min-height: 100vh; padding: 20px; }
        .wrap { max-width: 480px; margin: 0 auto; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; color: var(--white); text-align: center; margin-bottom: 4px; }
        .logo span { color: var(--coral); }
        .evt { text-align: center; color: rgba(245,243,240,0.7); font-size: 14px; margin-bottom: 20px; }
        .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,107,107,0.2); border-radius: 10px; padding: 24px 20px; }
        label { display: block; font-size: 12px; font-weight: 700; color: rgba(245,243,240,0.85); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type=email], input[type=text], input[type=tel] { width: 100%; padding: 14px 15px; background: #fff; border: 2px solid rgba(255,107,107,0.35); border-radius: 6px; color: #000; font-family: inherit; font-size: 16px; }
        input:focus { outline: none; border-color: var(--coral); }
        .seg { display: flex; gap: 10px; }
        .seg button { flex: 1; padding: 14px; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15); border-radius: 6px; color: var(--cream); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
        .seg button.on { background: var(--coral); border-color: var(--coral); color: #fff; }
        .toggle-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
        .toggle-row input { width: 22px; height: 22px; accent-color: var(--coral); flex-shrink: 0; }
        .toggle-row label { margin: 0; text-transform: none; font-size: 14px; font-weight: 500; letter-spacing: 0; }
        .submit { width: 100%; margin-top: 22px; padding: 17px; background: linear-gradient(135deg, var(--coral) 0%, #ff5252 100%); color: #fff; border: none; border-radius: 6px; font-weight: 700; font-size: 16px; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; }
        .submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
        .success-banner { text-align: center; padding: 32px 20px; }
        .success-banner .check { font-size: 56px; margin-bottom: 12px; }
        .success-banner h2 { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 8px; }
        .success-banner p { font-size: 14px; color: rgba(245,243,240,0.7); margin-bottom: 20px; }
        .back-btn { background: none; border: 1px solid rgba(255,107,107,0.4); color: var(--coral); padding: 10px 24px; border-radius: 6px; font-family: inherit; font-size: 14px; cursor: pointer; }
        .no-event { text-align: center; padding: 40px 20px; }
        .no-event p { color: rgba(245,243,240,0.6); font-size: 15px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo">Spark<span>Date</span></div>
        <div class="evt" id="evtLine">Loading…</div>

        <!-- No-event state -->
        <div id="noEvent" style="display:none;" class="card no-event">
            <p>No upcoming event found.<br>Check back closer to the event date.</p>
        </div>

        <!-- Check-in form -->
        <div class="card" id="formCard">
            <form id="checkinForm" autocomplete="off">
                <label for="ciEmail">Email *</label>
                <input type="email" id="ciEmail" required autocomplete="off" inputmode="email" placeholder="your@email.com">

                <label for="ciName">First name</label>
                <input type="text" id="ciName" autocomplete="off" placeholder="First name">

                <label>Gender</label>
                <div class="seg" id="genderSeg">
                    <button type="button" data-g="woman">Woman</button>
                    <button type="button" data-g="man">Man</button>
                </div>

                <div class="toggle-row">
                    <input type="checkbox" id="ciFirstTime">
                    <label for="ciFirstTime">First time at a SparkDate event?</label>
                </div>
                <div class="toggle-row">
                    <input type="checkbox" id="ciPhoto">
                    <label for="ciPhoto">OK to feature in photos / stories?</label>
                </div>

                <button type="submit" class="submit" id="ciSubmit">Check in →</button>
                <div class="msg" id="ciMsg"></div>
            </form>
        </div>

        <!-- Success state -->
        <div class="card success-banner" id="successCard" style="display:none;">
            <div class="check">✅</div>
            <h2>You're checked in!</h2>
            <p id="successName"></p>
            <button class="back-btn" id="backBtn">Check in someone else</button>
        </div>
    </div>

    <script>
        let event = null;
        let gender = null;

        async function loadEvent() {
            const line = document.getElementById('evtLine');
            try {
                const r = await fetch('/api/next-event');
                const d = await r.json();
                if (d && d.event && d.event.id) {
                    event = { id: d.event.id, title: d.event.title || 'SparkDate event' };
                    const dt = d.event.date ? new Date(d.event.date) : null;
                    const when = dt ? dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
                    line.textContent = `${event.title}${when ? ' · ' + when : ''}`;
                } else {
                    line.textContent = '';
                    document.getElementById('formCard').style.display = 'none';
                    document.getElementById('noEvent').style.display = '';
                }
            } catch (_) {
                line.textContent = 'Could not load event. Check connection.';
            }
        }

        document.getElementById('genderSeg').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-g]');
            if (!btn) return;
            gender = btn.dataset.g;
            document.querySelectorAll('#genderSeg button').forEach(b => b.classList.toggle('on', b === btn));
        });

        const form = document.getElementById('checkinForm');
        const submitBtn = document.getElementById('ciSubmit');
        const msg = document.getElementById('ciMsg');

        function showSuccess(name) {
            document.getElementById('formCard').style.display = 'none';
            const sc = document.getElementById('successCard');
            sc.style.display = '';
            document.getElementById('successName').textContent =
                name ? `Welcome, ${name}! Check your email for a link to rate your matches after tonight.` :
                'Check your email after the event for a link to rate your matches.';
        }

        function resetForm() {
            form.reset();
            gender = null;
            document.querySelectorAll('#genderSeg button').forEach(b => b.classList.remove('on'));
            msg.textContent = '';
            document.getElementById('ciEmail').focus();
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            document.getElementById('successCard').style.display = 'none';
            document.getElementById('formCard').style.display = '';
            resetForm();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!event) { msg.style.color = 'var(--danger)'; msg.textContent = 'Event not loaded yet. Try refreshing.'; return; }
            const email = document.getElementById('ciEmail').value.trim();
            const firstName = document.getElementById('ciName').value.trim();
            const firstTime = document.getElementById('ciFirstTime').checked;
            const photoConsent = document.getElementById('ciPhoto').checked;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Checking in…';
            msg.textContent = '';
            try {
                const res = await fetch('/api/lead-signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'checkin', email, firstName, gender, firstTime, photoConsent, eventId: event.id, eventTitle: event.title }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Check-in failed');
                showSuccess(firstName);
            } catch (err) {
                msg.style.color = 'var(--danger)';
                msg.textContent = err.message || 'Something went wrong. Try again.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Check in →';
            }
        });

        loadEvent();
    </script>
</body>
</html>
