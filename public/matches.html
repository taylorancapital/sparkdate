<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Per-attendee magic link; never index. -->
    <meta name="robots" content="noindex, nofollow">
    <script>
      if (location.host === 'www.sparkdate.date') {
        location.replace('https://sparkdate.date' + location.pathname + location.search + location.hash);
      }
    </script>
    <title>Who did you click with? — SparkDate</title>
    <link rel="canonical" href="https://sparkdate.date/matches">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-21YLCC35F1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-21YLCC35F1', { 'page_path': window.location.pathname });
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --navy: #0a0e27; --coral: #ff6b6b; --cream: #f5f3f0; --white: #fff; --success: #4ade80; --danger: #f87171; --info: #60a5fa; --gold: #f5c451; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%); color: var(--cream); line-height: 1.55; min-height: 100vh; padding: 28px 18px 60px; }
        .wrap { max-width: 520px; margin: 0 auto; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; color: var(--white); text-align: center; }
        .logo span { color: var(--coral); }
        h1 { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 900; margin: 22px 0 6px; letter-spacing: -0.5px; }
        .sub { color: rgba(245,243,240,0.7); font-size: 14px; margin-bottom: 22px; }
        .event-group { margin-bottom: 26px; }
        .event-group-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(255,107,107,0.2); padding-bottom: 8px; margin-bottom: 12px; }
        .event-group-title { font-weight: 700; font-size: 16px; color: var(--white); }
        .event-group-date { font-size: 12px; color: var(--gold); }
        .attendee-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .attendee-name { font-weight: 600; font-size: 15px; }
        .attendee-meta { font-size: 12px; color: rgba(245,243,240,0.5); }
        .connect-btn { padding: 10px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,107,107,0.5); border-radius: 6px; color: var(--coral); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .connect-btn:disabled { opacity: 0.6; cursor: wait; }
        .connect-state { font-size: 13px; font-weight: 700; white-space: nowrap; }
        .connect-state.matched { color: var(--success); }
        .connect-state.sent { color: rgba(245,243,240,0.5); }
        .match-contact { margin-top: 6px; font-size: 13px; color: var(--success); line-height: 1.5; }
        .empty, .bad { color: rgba(245,243,240,0.6); font-size: 14px; text-align: center; padding: 24px 0; }
        a { color: var(--coral); }
        .invite-block { margin-top: 30px; padding: 20px 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,107,107,0.25); border-radius: 8px; text-align: center; }
        .invite-block h3 { font-family: 'Playfair Display', serif; font-size: 16px; margin-bottom: 6px; }
        .invite-block p { font-size: 13px; color: rgba(245,243,240,0.7); margin-bottom: 14px; }
        .invite-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .invite-row input { flex: 1; min-width: 160px; padding: 9px 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; color: var(--cream); font-family: inherit; font-size: 12px; }
        .invite-row button, .invite-share a { padding: 9px 14px; font-size: 12px; font-weight: 600; border-radius: 4px; text-decoration: none; font-family: inherit; cursor: pointer; }
        .invite-row button { background: var(--coral); color: #fff; border: none; }
        .invite-share { margin-top: 10px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .invite-share a { color: var(--coral); border: 1px solid rgba(255,107,107,0.4); background: transparent; }
        /* Compact next-event + Getaways strip -- top of mind, not intrusive.
           Sits right under the intro line, before the event groups, so it's
           seen immediately rather than buried below however many attendees
           someone scrolls through; sized like a single attendee row, not a
           card, so it doesn't compete with the actual matching list below. */
        .promo-strip { margin-top: 8px; margin-bottom: 22px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,107,107,0.3); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
        .promo-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .promo-row + .promo-row { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 6px; }
        .promo-text { font-size: 12px; color: rgba(245,243,240,0.75); }
        .promo-link { font-size: 11.5px; font-weight: 600; color: var(--coral); white-space: nowrap; text-decoration: none; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo">Spark<span>Date</span></div>
        <div id="content">
            <div class="empty">Loading…</div>
        </div>

        <!-- Bring-a-friend: the already-built referral link (same convention
             as account.html's invite section), surfaced here since this is
             the highest-intent moment — right after someone engaged with
             matching. No incentive attached, just visibility. -->
        <div class="invite-block" id="inviteBlock" style="display:none">
            <h3>Know someone who'd love this?</h3>
            <p>Bring a friend next time — share your invite link.</p>
            <div class="invite-row">
                <input type="text" id="inviteLink" readonly aria-label="Your invite link">
                <button type="button" id="copyInviteBtn">Copy</button>
            </div>
            <div class="invite-share" id="inviteShare"></div>
        </div>
    </div>

    <script>
      (function () {
        var qs = new URLSearchParams(location.search);
        var uid = qs.get('uid') || '';
        var token = qs.get('t') || '';
        var content = document.getElementById('content');

        var esc = function (s) {
          return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        };
        var intentLabels = { long_term: 'Long-term', dating_around: 'Dating around', friends_first: 'Friends first' };

        if (!uid || !token) {
          content.innerHTML = '<h1>This link isn’t valid.</h1><p class="bad">It may have expired or been mistyped. Check your most recent SparkDate email for the latest link.</p>';
          return;
        }

        // Bring-a-friend: same link-building convention as account.html's
        // setupInvite() (ref=<uid> attribution, no new tracking logic) —
        // just a new surface. Doesn't need the match data to load first.
        // Points at /lp, not the homepage or /events — a referred friend is
        // cold traffic with the same profile lp.html is built for (focused
        // single CTA, no nav to get lost in), and lp.html captures an
        // incoming ?ref= into localStorage (sparkdate_ref) the same way
        // index.html does; events.html doesn't, so a ref landing there would
        // be silently dropped.
        function setupInvite() {
          try {
            var link = 'https://sparkdate.date/lp?ref=' + encodeURIComponent(uid) + '&utm_source=referral&utm_medium=referral&utm_campaign=matches_page';
            var block = document.getElementById('inviteBlock');
            var input = document.getElementById('inviteLink');
            if (input) input.value = link;
            if (block) block.style.display = 'block';

            var copyBtn = document.getElementById('copyInviteBtn');
            if (copyBtn) copyBtn.addEventListener('click', async function () {
              try { await navigator.clipboard.writeText(link); }
              catch (_) { input.focus(); input.select(); document.execCommand('copy'); }
              var orig = copyBtn.textContent;
              copyBtn.textContent = 'Copied!';
              if (typeof gtag === 'function') gtag('event', 'share', { method: 'copy_link', content_type: 'referral' });
              setTimeout(function () { copyBtn.textContent = orig; }, 1800);
            });

            var msg = 'Come to a SparkDate event with me — real people, real venues:';
            var enc = encodeURIComponent(link);
            var encMsg = encodeURIComponent(msg);
            var targets = [
              { label: 'Text', href: 'sms:?&body=' + encMsg + '%20' + enc },
              { label: 'WhatsApp', href: 'https://wa.me/?text=' + encMsg + '%20' + enc },
              { label: 'Email', href: 'mailto:?subject=' + encodeURIComponent('Come to a SparkDate event with me') + '&body=' + encMsg + '%20' + enc },
            ];
            var wrap = document.getElementById('inviteShare');
            if (wrap) {
              wrap.innerHTML = targets.map(function (t) {
                return '<a href="' + t.href + '" target="_blank" rel="noopener" data-share="' + esc(t.label) + '">' + esc(t.label) + '</a>';
              }).join('');
              wrap.querySelectorAll('[data-share]').forEach(function (a) {
                a.addEventListener('click', function () {
                  if (typeof gtag === 'function') gtag('event', 'share', { method: a.dataset.share, content_type: 'referral' });
                });
              });
            }
          } catch (e) {
            console.error('[invite] setup failed', e);
          }
        }

        // Compact next-event + Getaways strip -- same high-attention moment
        // as the pre-match hype email (api/cron-send-emails.js's
        // sendPreMatchHype), same content, same city-aware fallback (reuses
        // the server's getNextEventForCity via /api/declare-connection's new
        // `nextEvent` field), just a lighter-touch presentation for a page
        // instead of an email. Own UTM params so this traffic is attributable
        // separately from the email's clicks.
        function renderPromoStrip(nextEvent) {
          var ne = nextEvent && nextEvent.event;
          var html = '<div class="promo-strip">';
          if (ne) {
            var heading = nextEvent.sameCity ? 'Next up' : 'Our next mixer';
            var ticketUrl = (ne.ticketPath || '') + '&utm_source=matches&utm_medium=web&utm_campaign=matches_page';
            html += '<div class="promo-row">'
              + '<span class="promo-text">📅 ' + esc(heading) + ': ' + esc(ne.title) + (ne.dateLabel ? ', ' + esc(ne.dateLabel) : '') + '</span>'
              + '<a class="promo-link" href="' + esc(ticketUrl) + '" data-promo="next_mixer">Reserve →</a>'
              + '</div>';
          }
          html += '<div class="promo-row">'
            + '<span class="promo-text">🌴 Getaways: vote + a shot at a free trip</span>'
            + '<a class="promo-link" href="/getaways?utm_source=matches&utm_medium=web&utm_campaign=matches_page" data-promo="getaways">Vote →</a>'
            + '</div>';
          html += '</div>';
          return html;
        }

        function render(events, nextEvent) {
          if (!events || events.length === 0) {
            content.innerHTML = '<h1>Nothing here yet.</h1><p class="bad">Once you’ve attended an event, the people you met show up here.</p>' + renderPromoStrip(nextEvent);
            wireUpPromoTracking();
            return;
          }
          var html = '<h1>Who did you click with?</h1>'
            + '<p class="sub">Tap everyone you’d like to see again. If they pick you too, we’ll share contact info so you can meet up.</p>'
            + renderPromoStrip(nextEvent);
          events.forEach(function (ev) {
            var d = ev.date ? new Date(ev.date) : null;
            var dateStr = d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
            html += '<div class="event-group"><div class="event-group-header">'
              + '<div class="event-group-title">' + esc(ev.title) + '</div>'
              + '<div class="event-group-date">' + esc(dateStr) + '</div></div>';
            if (!ev.attendees || ev.attendees.length === 0) {
              html += '<div class="empty">No other attendees registered.</div>';
            } else {
              ev.attendees.forEach(function (a) {
                html += renderAttendee(a, ev.eventId);
              });
            }
            html += '</div>';
          });
          content.innerHTML = html;
          content.querySelectorAll('button.connect-btn[data-uid]').forEach(function (btn) {
            btn.addEventListener('click', function () { pick(btn.dataset.uid, btn.dataset.event, btn); });
          });
          wireUpPromoTracking();
        }

        function wireUpPromoTracking() {
          content.querySelectorAll('[data-promo]').forEach(function (a) {
            a.addEventListener('click', function () {
              if (typeof gtag === 'function') gtag('event', 'select_content', { content_type: 'promo', item_id: a.dataset.promo, source: 'matches' });
            });
          });
        }

        function renderAttendee(a, eventId) {
          var genderDisp = ({ woman: 'Woman', man: 'Man' })[a.gender] || '';
          var meta = [a.age, genderDisp, intentLabels[a.intent] || ''].filter(Boolean).join(' · ');
          var action = '', extra = '';
          if (a.state === 'matched') {
            action = '<div class="connect-state matched">Matched ✨</div>';
            var c = a.contact || {};
            var reach = c.phone ? ('📞 ' + esc(c.phone)) : (c.email ? ('✉️ ' + esc(c.email)) : 'Reconnect at the next event');
            extra = '<div class="match-contact">You both clicked! Reach ' + esc(c.name || a.displayName) + ': ' + reach + '</div>';
          } else if (a.state === 'info') {
            // Guest with no account — visible but not selectable (no uid to match).
            action = '<div class="connect-state sent">Attended</div>';
          } else if (a.state === 'sent') {
            action = '<div class="connect-state sent">Saved</div>';
          } else if (a.state === 'received') {
            action = '<button class="connect-btn" data-uid="' + esc(a.uid) + '" data-event="' + esc(eventId) + '" style="border-color: var(--info); color: var(--info);">They picked you · I did too</button>';
          } else {
            action = '<button class="connect-btn" data-uid="' + esc(a.uid) + '" data-event="' + esc(eventId) + '">I clicked with them</button>';
          }
          return '<div class="attendee-row"><div><div class="attendee-name">' + esc(a.displayName) + '</div>'
            + '<div class="attendee-meta">' + esc(meta) + '</div>' + extra + '</div>' + action + '</div>';
        }

        async function load() {
          content.innerHTML = '<div class="empty">Loading…</div>';
          var ctrl = new AbortController();
          var timer = setTimeout(function () { ctrl.abort(); }, 15000);
          try {
            var res = await fetch(
              '/api/declare-connection?uid=' + encodeURIComponent(uid) + '&t=' + encodeURIComponent(token),
              { signal: ctrl.signal }
            );
            clearTimeout(timer);
            var data = await res.json();
            if (!res.ok) throw new Error(data.error || 'load failed');
            render(data.events, data.nextEvent);
          } catch (e) {
            clearTimeout(timer);
            var msg = ctrl.signal.aborted
              ? 'Connection timed out — check your signal and try again.'
              : (e.message || 'Could not load. Please try the latest link from your email.');
            content.innerHTML = '<h1>Something went wrong.</h1><p class="bad">' + esc(msg) + '</p>'
              + '<button class="connect-btn" onclick="load()" style="display:block;margin:16px auto 0;">Retry</button>';
          }
        }

        async function pick(toUserId, eventId, btn) {
          btn.disabled = true; btn.textContent = 'Saving…';
          try {
            var res = await fetch('/api/declare-connection', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ uid: uid, t: token, toUserId: toUserId, eventId: eventId })
            });
            var data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Could not save');
            if (typeof gtag === 'function') gtag('event', 'select_item', { item_list_name: 'matches' });
            load(); // re-render with fresh state (sent / matched)
          } catch (e) {
            btn.disabled = false; btn.textContent = 'I clicked with them';
            alert(e.message || 'Could not save. Please try again.');
          }
        }

        load();
        setupInvite();
      })();
    </script>
</body>
</html>
